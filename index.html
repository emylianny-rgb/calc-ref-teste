<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora da Reforma Tributária</title>
</head>

<body>

<h2>Calculadora</h2>

<input type="range" id="faturamento" min="1000" max="400000" step="1000" value="15000">
<p id="valorFaturamento"></p>

<script>
(function() {

  const SIMPLES_RATES = {
    comercio: { anexo: "Anexo I — Comércio", rate: 0.04 },
    industria: { anexo: "Anexo II — Indústria", rate: 0.045 },
    servicos: { anexo: "Anexo III — Serviços", rate: 0.06 },
    servicos_intelectuais: { anexo: "Anexo V — Serviços intelectuais", rate: 0.155 },
  };

  const CBS_IBS_PADRAO = 0.265;

  const state = {
    porte: "me",
    setor: "comercio",
    faturamento: 15000,
    pctClientesPJ: 30,
    pctInsumos: 25,
  };

  function brl(v) {
    return v.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL",
      maximumFractionDigits: 0
    });
  }

  function compute() {

    let result;

    if (state.porte === "mei") {

      const dasMei = 75.9;

      result = {
        atualValor: dasMei,
        atualPct: (dasMei / Math.max(state.faturamento, 1)) * 100,
        hibridoValor: dasMei,
        hibridoPct: (dasMei / Math.max(state.faturamento, 1)) * 100,
        recomendacao: "Manter MEI"
      };

    } else {

      const rateSimples = SIMPLES_RATES[state.setor].rate;
      const tributoSimples = state.faturamento * rateSimples;

      const vendasPJ = state.faturamento * (state.pctClientesPJ / 100);
      const insumos = state.faturamento * (state.pctInsumos / 100);

      const cbsIbsDevido = vendasPJ * CBS_IBS_PADRAO;
      const creditoInsumos = insumos * CBS_IBS_PADRAO;

      const cbsIbsLiquido = Math.max(cbsIbsDevido - creditoInsumos, 0);

      const totalHibrido = tributoSimples + cbsIbsLiquido;

      const diff = totalHibrido - tributoSimples;

      // ✅ CORREÇÃO AQUI — removido o "n" que quebrava o código
      const recomendacao = state.pctClientesPJ >= 50 && diff < tributoSimples * 0.15
        ? "Considerar regime híbrido"
        : "Manter Simples Nacional padrão";

      result = {
        atualValor: tributoSimples,
        atualPct: rateSimples * 100,
        hibridoValor: totalHibrido,
        hibridoPct: (totalHibrido / Math.max(state.faturamento, 1)) * 100,
        recomendacao
      };
    }

    return result;
  }

  function render() {
    const r = compute();

    document.getElementById("valorFaturamento").innerText =
      "Faturamento: " + brl(state.faturamento) +
      " | Recomendação: " + r.recomendacao;
  }

  document.getElementById("faturamento").addEventListener("input", (e)=> {
    state.faturamento = Number(e.target.value);
    render();
  });

  render();

})();
</script>

</body>
</html>
